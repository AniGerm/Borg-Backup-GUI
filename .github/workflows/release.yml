name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-gi gir1.2-ayatanaappindicator3-0.1 \
            python3-pil python3-fonttools python3-defusedxml dpkg-dev borgbackup \
            policykit-1 openssh-client
      - name: venv + deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements-dev.txt
      - name: QA
        run: ./QA.sh
      - name: Pytest
        run: .venv/bin/pytest -q
      - name: Build .deb
        run: |
          chmod +x packaging/build_deb.sh start_gui.sh
          ./packaging/build_deb.sh
          (cd dist && sha256sum borg-backup-gui_*.deb > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.deb
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
