[mypy]
strict = True
explicit_package_bases = True
mypy_path = .

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-pystray.*]
ignore_missing_imports = True

[mypy-gi.*]
ignore_missing_imports = True

[mypy-fpdf.*]
ignore_missing_imports = True

# Legacy monolith GUI: gradually typed; keep gate green while borg_model is strict.
[mypy-borg_backup_gui]
strict = False
disallow_untyped_defs = False
disallow_untyped_calls = False
check_untyped_defs = False
allow_untyped_defs = True
warn_return_any = False
disable_error_code = union-attr, call-overload, var-annotated, type-arg, no-untyped-call, no-untyped-def

[mypy-Hetzner_Backup_and_Restore.borg_backup_gui]
strict = False
disallow_untyped_defs = False
disallow_untyped_calls = False
check_untyped_defs = False
